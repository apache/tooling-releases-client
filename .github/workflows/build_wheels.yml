name: build-dists
on: [workflow_dispatch]
permissions: { contents: read }

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: manylinux-amd64,   image: quay.io/pypa/manylinux_2_28_x86_64:2026.10.21-1@sha256:b74a5b6f1705ecff17be8bd792589bef9b3b039766d12205720ecd2a9e919192,  runs_on: ubuntu-22.04 }
          - { name: manylinux-aarch64, image: quay.io/pypa/manylinux_2_28_aarch64:2026.10.21-1@sha256:0333f44c4eb759ec8f47b27bc9dc27b1c929932a267cf13ce0cff1a4b758cccb, runs_on: ubuntu-22.04-arm }
          - { name: musllinux-amd64,   image: quay.io/pypa/musllinux_1_2_x86_64:2026.10.21-1@sha256:767e9118e48b4b8de84d3262ba95a3bc5f6679a09247f0bf9e283445608f37c1,   runs_on: ubuntu-22.04 }
          - { name: musllinux-aarch64, image: quay.io/pypa/musllinux_1_2_aarch64:2026.10.21-1@sha256:0a7b18a1fce3dcfb1a6dd2ac99f077b78fb0f3cec8a2fed65bb999823c6a8fa0,  runs_on: ubuntu-22.04-arm }
    runs-on: ${{ matrix.runs_on }}
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: uv build --sdist --wheel
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: 'dist/*'

  macos-aarch64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv build --sdist --wheel
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-aarch64
          path: 'dist/*'
