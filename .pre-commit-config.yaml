minimum_prek_version: "0.5.7"
default_env:
  UV_EXCLUDE_NEWER: "5 days"
update:
  cooldown_days: 7
  freeze: true
  exclude_tags: "*-{alpha,beta,next,rc}*"
  repos:
    "https://github.com/woodruffw/zizmor-pre-commit":
      exclude_tags: ["*-{alpha,beta,next,rc}*", "*rc*"]
repos:
- repo: https://github.com/woodruffw/zizmor-pre-commit
  rev: b546b77c44c466a54a42af5499dcc0dcc1a3193f  # frozen: v1.22.0
  hooks:
    - id: zizmor
      args: [--min-severity, low]

- repo: local
  hooks:
    - id: ruff
      name: Ruff Linter
      entry: uv run --frozen ruff check --fix
      language: system
      types: [python]

    - id: ruff-format
      name: Ruff Formatter
      entry: uv run --frozen ruff format --force-exclude
      language: system
      types: [python]

    - id: pyright
      name: Pyright Type Check
      entry: uv run --frozen pyright
      language: system
      require_serial: true
      types: [python]
