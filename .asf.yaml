github:
  description: "Apache Trusted Releases Client"
  homepage: https://tooling.apache.org/
  dependabot_alerts: true
  dependabot_updates: false
  rulesets:
    - name: "Main branch"
      type: branch
      branches:
        includes:
          - "main"
    - name: "Release tags"
      target: tag
      enforcement: active
      conditions:
        ref_name:
          include:
            - "refs/tags/v*"
          exclude: []
      rules:
        - type: update
        - type: deletion
  environments:
    pypi:
      required_reviewers:
        - id: 184941 # sbp, Sean B. Palmer
          type: User
        - id: 450789 # alitheg, Alastair McFarlane
          type: User
        - id: 29803617 # dave2wave, Dave Fisher
          type: User
        - id: 692523 # andrewmusselman, Andrew Musselman
          type: User
      prevent_self_review: true
      deployment_branch_policy:
        policies:
          - name: "v*"
            type: tag
  del_branch_on_merge: true
  features:
    issues: true
    projects: true
  enabled_merge_buttons:
    squash:  true
    squash_commit_message: DEFAULT
    merge:   false
    rebase:  true
  custom_subjects:
    new_pr: "[PR] {title} ({repository})"
    close_pr: "Re: [PR] {title} ({repository})"
    comment_pr: "Re: [PR] {title} ({repository})"
    merge_pr: "Re: [PR] {title} ({repository})"
    new_issue: "[I] {title} ({repository})"
    comment_issue: "Re: [I] {title} ({repository})"
    close_issue: "Re: [I] {title} ({repository})"
    catchall: "[GH] {title} ({repository})"

notifications:
  commits:      commits@tooling.apache.org
  issues:       issues@tooling.apache.org
  pullrequests: issues@tooling.apache.org
